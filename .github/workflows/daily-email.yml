name: TrendingAI Daily Email

on:
  schedule:
    # GitHub Actions uses UTC. 04:00 UTC = 12:00 Asia/Shanghai.
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      edition:
        description: Edition to send
        required: true
        default: current
        type: choice
        options: [current, morning, evening]

permissions:
  contents: write

concurrency:
  group: trendingai-daily-email
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Codex editorial issue and send QQ email
        env:
          QQ_EMAIL: ${{ secrets.QQ_EMAIL }}
          QQ_SMTP_AUTH_CODE: ${{ secrets.QQ_SMTP_AUTH_CODE }}
          DIGEST_RECIPIENTS: ${{ vars.DIGEST_RECIPIENTS }}
          PAGES_BASE_URL: https://leftseinem.github.io/TrendingAI/daily
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/publish_editorial_issue.py --edition "${{ inputs.edition || 'current' }}"
      - name: Save rendered Pages content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/daily
          git diff --cached --quiet || git commit -m "chore: render editorial digest pages"
          git pull --rebase origin main
          git push origin main
