name: TrendingAI Daily Email

on:
  schedule:
    # GitHub Actions uses UTC. 03:07/09:07 UTC = 11:07/17:07 Asia/Shanghai.
    - cron: "7 3,9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trendingai-daily-email
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch news and send QQ email
        env:
          QQ_EMAIL: ${{ secrets.QQ_EMAIL }}
          QQ_SMTP_AUTH_CODE: ${{ secrets.QQ_SMTP_AUTH_CODE }}
          DIGEST_RECIPIENTS: ${{ vars.DIGEST_RECIPIENTS }}
          # Optional AI editing layer. If any value is missing or the API fails,
          # the script automatically falls back to deterministic editorial rules.
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ vars.AI_BASE_URL }}
          AI_MODEL: ${{ vars.AI_MODEL }}
        run: python scripts/send_daily_digest.py
      - name: Save deduplication history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sent_history.json
          git diff --cached --quiet || git commit -m "chore: update digest history"
          git push
