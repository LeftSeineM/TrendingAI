name: TrendingAI Daily Email

on:
  schedule:
    # GitHub Actions uses UTC. 00:00/10:00 UTC = 08:00/18:00 Asia/Shanghai.
    - cron: "0 0,10 * * *"
  workflow_dispatch:
    inputs:
      edition:
        description: Edition to send
        required: true
        default: current
        type: choice
        options: [current, morning, evening]

permissions:
  contents: write

concurrency:
  group: trendingai-daily-email
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch news and send QQ email
        env:
          QQ_EMAIL: ${{ secrets.QQ_EMAIL }}
          QQ_SMTP_AUTH_CODE: ${{ secrets.QQ_SMTP_AUTH_CODE }}
          DIGEST_RECIPIENTS: ${{ vars.DIGEST_RECIPIENTS }}
          # Optional AI editing layer. If any value is missing or the API fails,
          # the script automatically falls back to deterministic editorial rules.
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ vars.AI_BASE_URL }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          PAGES_BASE_URL: https://leftseinem.github.io/TrendingAI/daily
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/send_daily_digest.py --edition "${{ inputs.edition || 'current' }}"
      - name: Save successful marker, history and Pages content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data docs/daily
          git diff --cached --quiet || git commit -m "chore: publish digest and delivery marker"
          git pull --rebase origin main
          git push origin main
